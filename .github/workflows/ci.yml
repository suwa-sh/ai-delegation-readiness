# SHA pinned actions per the OSS hardening checklist.
# Workflow-wide permissions default to read-only; jobs only escalate when needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # pyproject is the single source of truth; this pulls the pinned
        # overlay-scoring-skeleton engine from PyPI (must be published first).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Smoke test the CLI
        run: |
          bin/aidr --help
          bin/aidr validate-audit-log examples/audit-log-sample.json --level extended
          bin/aidr check-patch-ownership examples/patches/sample-cheap-green.csv

      - name: Check documentation links
        run: python3 scripts/check-doc-links.py

      - name: Check example overlays
        run: |
          bin/aidr check-overlay examples/overlays/sample-company/extra-rules.yaml
          bin/aidr check-overlay examples/overlays/patch-ownership/extra-risk.yaml
          bin/aidr check-overlay examples/overlays/patch-decision/team-bands.yaml
