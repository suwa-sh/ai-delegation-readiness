version: 1
name: four-layer-delegation-readiness
separator: "."
description: |
  4 layer prerequisites for delegating high-risk routine business judgments
  to AI agents, derived from the Ajinomoto AFS accounting AI agent case.
  Lower layers must hold before upper layers can succeed.

# group の役割宣言 (header の role フィールド):
# - role 未指定 / role: gating … 積み上げゲート層 (下層 pass が上層点検の前提。L1-L4)。
# - role: parallel            … ゲートしない並列軸 (単独で採点し conclusion に寄与するが
#                               層のゲートには関与しない。efficacy / organization)。
#   check_readiness.py / list_definitions.py はこの role で層と並列軸を振り分ける。
#   未知の role 値 (typo 等) は静かに降格させず loud にエラーにする (誤分類の防止)。
#
# case_evidence.confidence の語彙 (自由文字列だが下記 3 値に揃える):
# - observed_fact            … 出典で確認できる観測事実。
# - gap_in_source            … 出典に記載が無い / 定義されていない箇所。
# - claim_needs_verification … 主張はあるが出典が数値の再確認を留保している (事実断定しない)。
#
# 拡張ポイント宣言: 各社のオーバーレイで何ができるかを self-documenting に
# - add:         既存 group への leaf 追加のみ可。既存 item の上書き・削除は不可。
# - strengthen:  閾値を厳しい方向にのみ変更可(緩和は不可)。
extension_points:
  - {group: "L*", allow: add}
  - {group: "efficacy", allow: add}
  - {group: "organization", allow: add}
  - {group: "L*", level: group, field: pass, allow: strengthen, direction: higher}
  - {group: "L*", level: group, field: revise, allow: strengthen, direction: higher}
  - {group: "efficacy", level: group, field: pass, allow: strengthen, direction: higher}
  - {group: "efficacy", level: group, field: revise, allow: strengthen, direction: higher}
  - {group: "organization", level: group, field: pass, allow: strengthen, direction: higher}
  - {group: "organization", level: group, field: revise, allow: strengthen, direction: higher}

# 各層は積み上げ。下層の合否が pass でなければ上層の点検に進む意味はない。
items:
  # --- L1 ---
  - id: "L1"
    name: business_standardization
    name_ja: 業務標準化層
    purpose: |
      The foundation. The judgment criteria must be documented; exceptions
      must be explicit procedures; the rule book must have a version history.
    pass: 1.0       # all Yes
    revise: 0.5     # majority Yes
    # below revise => block
    case_evidence:
      - text: Ajinomoto Group operates as accounting BPO with continuous standardization
        confidence: observed_fact
        source: https://www.itmedia.co.jp/business/articles/2606/19/news033.html
      - text: AFS consolidates the group's domestic financial accounting as a shared services company
        confidence: observed_fact
        source: https://www.fastaccounting.jp/news/20260424/15929/
  - id: "L1.Q1"
    text: Are the judgment criteria documented and free from tacit knowledge?
    text_ja: "判断基準は文書化され、暗黙知に依存していないか"
    weight: 1.0
  - id: "L1.Q2"
    text: Are exceptions explicitly defined as procedures (not implicit)?
    text_ja: "例外ケースは(暗黙でなく)例外手続きとして明文化されているか"
    weight: 1.0
  - id: "L1.Q3"
    text: Is the rule book versioned (revision date, reason, history)?
    text_ja: "規定集は版管理されているか(改定日・理由・履歴を辿れるか)"
    weight: 1.0
  - id: "L1.Q4"
    text: Is the SOP written at a granularity that a third party can reproduce?
    text_ja: "SOP は第三者が読んで再現できる粒度で書かれているか"
    weight: 1.0

  # --- L2 ---
  - id: "L2"
    name: judgment_structuring
    name_ja: 判断構造化層
    purpose: |
      Map each rule clause to a triple of (which input, which condition,
      which decision). This layer is what created the 40-point gap between
      a domain-specialized agent (93.3%) and a vanilla LLM (53.3%).
    pass: 1.0
    revise: 0.66
    case_evidence:
      - text: Domain-specialized agent achieved 93.3% versus 53.3% for vanilla LLM on 3 published tasks
        confidence: observed_fact
        source: https://www.itmedia.co.jp/business/articles/2606/19/news033.html
  - id: "L2.Q1"
    text: Can each rule clause be mapped to (which input, which condition, which decision)?
    text_ja: "規定の各条項を「どの入力を・どの条件で・どう判定するか」の三つ組に落とせるか"
    weight: 1.0
  - id: "L2.Q2"
    text: Is there a clear line between deterministic processing, LLM inference, and human escalation?
    text_ja: "決定論的処理・LLM の推論・人間へのエスカレーションの線引きが明確か"
    weight: 1.0
  - id: "L2.Q3"
    text: Is a regression test in place to detect accuracy degradation when the logic changes?
    text_ja: "判定ロジックの変更時に精度劣化を検出する回帰テストがあるか"
    weight: 1.0

  # --- L3 ---
  - id: "L3"
    name: delegation_scope
    name_ja: 委任範囲層
    purpose: |
      Restrict delegation to judgments where the answer can be defined and
      the verdict can be verified afterwards. Use the delegation matrix
      (verifiability x answer-definability) for the per-judgment scoring.
    pass: 1.0
    revise: 0.75
    case_evidence:
      - text: The 3 published tasks are all verifiable against documented rules (receipt items, invoice compliance, entertainment expense)
        confidence: observed_fact
        source: https://www.fastaccounting.jp/news/20260424/15929/
  - id: "L3.Q1"
    text: Can a third party score the same input the same way?
    text_ja: "第三者が同一入力で同じ判定を採点できるか"
    weight: 1.0
  - id: "L3.Q2"
    text: Can the rationale link to a specific clause (or SOP step) of the rule book?
    text_ja: "判定根拠を規定の条番号(または SOP のステップ番号)に紐付けられるか"
    weight: 1.0
  - id: "L3.Q3"
    text: Are out-of-scope domains (ethical, novel-policy) excluded from delegation?
    text_ja: "正解を定義しにくい領域(倫理判断・新規ポリシー策定)を委任対象から除外できているか"
    weight: 1.0
  - id: "L3.Q4"
    text: Can the verdict be reproduced later from the audit log?
    text_ja: "後から監査ログで判定を再現できるか"
    weight: 1.0

  # --- L4 ---
  - id: "L4"
    name: control_and_traceability
    name_ja: 統制・追跡層
    purpose: |
      Design the human-in-the-loop control point, the audit log, and the
      correction flow. Most of the source case's L4 details are not public,
      so this layer is largely design proposal.
    pass: 1.0
    revise: 0.6
    case_evidence:
      - text: Public information on L4 controls (correction flow, final-human placement, audit log design) is sparse; design proposal dominates
        confidence: gap_in_source
        source: https://www.itmedia.co.jp/business/articles/2606/19/news033.html
  - id: "L4.Q1"
    text: Are decision and execution separated so segregation of duties is maintained?
    text_ja: "職務分掌を保つため「判定」と「実行」が分離されているか"
    weight: 1.0
  - id: "L4.Q2"
    text: Can the rationale be retrieved from logs (referenced rule + checked items)?
    text_ja: "判定根拠(参照規定 + チェック項目)をログから取り出せるか"
    weight: 1.0
  - id: "L4.Q3"
    text: Does the audit log record Who/When/What/Why/Result as a structured schema?
    text_ja: "監査ログは Who/When/What/Why/Result を構造化スキーマで記録しているか"
    weight: 1.0
  - id: "L4.Q4"
    text: Is the rule version pinned in the log so past verdicts can be re-verified after a rule change?
    text_ja: "規定改定後も過去判定を再検証できるよう、規定バージョンをログに固定しているか"
    weight: 1.0
  - id: "L4.Q5"
    text: Is the correction flow for false approvals designed and logged?
    text_ja: "誤承認の補正フローが設計され、ログに残るか"
    weight: 1.0

  # --- efficacy (4 層と並列の独立観点) ---
  - id: "efficacy"
    name: efficacy_measurement
    name_ja: 効果測定
    role: parallel
    purpose: |
      Even if the 4 layers hold, the efficacy figures must be defensible
      (denominator, baseline, period). The cited "76% reduction" in coverage
      of the Ajinomoto case is not defined in the source article.
    pass: 1.0
    revise: 0.75
    case_evidence:
      - text: 10,000 approvals/month at ~5 min each, ~10,000 hours/year reduction projected
        confidence: observed_fact
        source: https://www.itmedia.co.jp/business/articles/2606/19/news033.html
      - text: The "76% reduction" headline does not define its denominator in the source article
        confidence: gap_in_source
        source: https://www.itmedia.co.jp/business/articles/2606/19/news033.html
  - id: "efficacy.E1"
    text: Can you describe the denominator, baseline, and time period of the reduction figure?
    text_ja: "削減数値の分母・基準値・期間を説明できるか"
    weight: 1.0
  - id: "efficacy.E2"
    text: Are expected and actual figures separated (vendor estimate vs in-house measurement)?
    text_ja: "期待値(ベンダー試算)と実績(自社実測)を区別しているか"
    weight: 1.0
  - id: "efficacy.E3"
    text: Is the figure scoped to all-of-process or part-of-process (and is that scope stated)?
    text_ja: "数値の対象範囲(業務全体か一部か)を明示しているか"
    weight: 1.0
  - id: "efficacy.E4"
    text: Are AI-caused false approvals and rejections tracked separately from efficiency?
    text_ja: "AI 起因の誤承認・誤差し戻しを効率とは別に集計しているか"
    weight: 1.0

  # --- organization (4 層と並列の独立軸: 組織 readiness) ---
  # 業務プロセスの委任 readiness (L1-L4) とは別に、組織がその委任を受け止められるか
  # (撤退判断 / 受け皿 / 知識移転 / bus factor) を並列に採点する。「業務は委任可だが
  # 組織が未成熟」を分離するための軸。出典: 味の素モデル記事の「6 条件チェックリスト」。
  # pass=1.0 (6/6), revise=0.66 (4/6 以上; 記事の「4 つ以上なら試行は妥当、3 つ以下なら
  # まず受け皿作り」に一致。6 問等重みで 4/6=0.667>=0.66, 3/6=0.5<0.66 → block)。
  - id: "organization"
    name: organization_readiness
    name_ja: 組織 readiness層
    role: parallel
    purpose: |
      Even if a process is delegable (L1-L4 pass), the organization must be
      able to absorb the delegation: the authority to pull the plug, a
      company-wide literacy layer to receive the tool, a knowledge-transfer
      contract, an incremental-split design for the scaling phase, and a
      bus-factor countermeasure. This axis is parallel to the four layers so
      that "process delegable but organization not ready" is scored on its own.
    pass: 1.0
    revise: 0.66
    # 反証 5 点を軸の根拠として記録。記事が数値の再確認を留保した反証 1 (技能 17% 低下) と
    # 反証 2 (ジュニア雇用 20% 減) は claim_needs_verification とし事実断定しない。
    case_evidence:
      - text: Skill drops ~17% in delegation mode (Anthropic study); the article flags this figure as needing re-verification
        confidence: claim_needs_verification
        source: https://suwa-sh.github.io/zenn-contents/articles/ai-fullstack-team-ajinomoto_20260626/
      - text: Junior hiring down ~20% (Stanford payroll data); the article flags this figure as needing re-verification
        confidence: claim_needs_verification
        source: https://suwa-sh.github.io/zenn-contents/articles/ai-fullstack-team-ajinomoto_20260626/
      - text: Repositories with bus factor 1 have a ~16% disappearance rate, so deliberate knowledge distribution is required
        confidence: observed_fact
        source: https://suwa-sh.github.io/zenn-contents/articles/ai-fullstack-team-ajinomoto_20260626/
      - text: A 40-60% velocity decline is observed at the 10-to-50 person inflection, so incremental-split must be designed from the exploration phase
        confidence: observed_fact
        source: https://suwa-sh.github.io/zenn-contents/articles/ai-fullstack-team-ajinomoto_20260626/
      - text: METR revised its methodology in 2026-02, conceding early-2026 is likely faster with AI; do not carry the 19% slowdown conclusion forward unqualified
        confidence: gap_in_source
        source: https://arxiv.org/abs/2507.09089
  - id: "organization.C1"
    text: Is there the authority and culture to decide to pull the plug within 8-12 months?
    text_ja: "8〜12 ヶ月以内に「やめる」と決められる権限と文化があるか"
    weight: 1.0
  - id: "organization.C2"
    text: Is a company-wide literacy layer (business-side receivers) grown to a double-digit headcount?
    text_ja: "受け皿となる全社リテラシー層(ビジネス側人材)が 2 桁人数まで育っているか"
    weight: 1.0
  - id: "organization.C3"
    text: Is an AI tool foundation (Copilot / internal chat / RAG) established at the individual level?
    text_ja: "AI ツール基盤(Copilot・社内チャット・RAG)が個人レベルで定着しているか"
    weight: 1.0
  - id: "organization.C4"
    text: Can a knowledge-transfer contract make internalization (the "I" of SECI) a KPI (e.g. IPA model contract)?
    text_ja: "知識移転契約で内面化(SECI の I)を KPI にできるか(例: IPA モデル契約)"
    weight: 1.0
  - id: "organization.C5"
    text: Can the incremental split for the scaling phase (Stream-aligned to Complicated-Subsystem / Platform) be designed in advance?
    text_ja: "拡大期の漸進分割(Stream-aligned から Complicated-Subsystem / Platform への切り出し)を事前に設計できるか"
    weight: 1.0
  - id: "organization.C6"
    text: Is a bus-factor countermeasure (pair programming / ADR / Knowledge Transfer Day) in operation?
    text_ja: "bus factor 対策(ペアプロ・ADR・Knowledge Transfer Day)を運用しているか"
    weight: 1.0
