# overlay のサンプル(物語の拡張ステップ): ミドリ精機株式会社(架空)が
# base の four-layer-delegation-readiness を自社ルールで拡張する例です。
#
# マージ規則(`aidr check-overlay` が機械的に検証します):
#   add          : 項目の追加のみ(既存項目は read-only)
#   strengthen   : 数値閾値を厳しい方向に変えることのみ
# それ以外(削除・置換・緩和)は検証エラーになります。

version: 1
extends: four-layer-delegation-readiness

add:
  # ミドリ精機は base の L1 質問に加えて、規程集の法務レビューを 12 ヶ月以内に
  # 受けていることを要求する。
  - id: "L1.MIDORI_Q5"
    text: Has legal approved the rule book within the last 12 months?
    text_ja: "規程集は直近 12 ヶ月以内に法務のレビューを受けているか"
    weight: 1.0

  # ミドリ精機の内部監査は、L4 統制層に「改ざん検知可能なストアへの保存」も求める
  # (構造化ログだけでは不足、という自社基準)。
  - id: "L4.MIDORI_Q6"
    text: Is the audit log stored in a tamper-evident store (WORM, hash chain, or signed)?
    text_ja: "監査ログは改ざん検知可能なストア(WORM・ハッシュチェーン・署名)に保存されているか"
    weight: 1.0

strengthen:
  # L4 は 80% 以上 yes でなければ revise と呼ばない(base の 0.6 → 0.8 は
  # 厳しい方向なので許可される)。
  "L4": {pass: 1.0, revise: 0.8}
