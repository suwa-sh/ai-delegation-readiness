# overlay(応用例): 軌跡単位統制の 2 軸(four-layer-delegation-readiness を拡張)。
#
# 長時間稼働エージェントの軌跡監視に関する技術調査から抽出しています
# (https://suwa-sh.github.io/zenn-contents/articles/long-horizon-agent-trajectory-oversight_20260721/)。
# 数時間から数週間、自律で動き続けるエージェントでは「各ステップは個別には
# 許容可能に見えるが、シーケンス全体は承認されない結果を生む」失敗モードが
# 実測つきで報告されています。既存の委任判断はアクション 1 件ずつの許可粒度を
# 暗黙の前提にしており、この前提が崩れる実行面の統制を独立した採点次元として
# 追加します。
#
# この overlay がやること:
#   並列軸を 2 本追加します — "L_trajectory_enforcement"(軌跡強制力軸:
#   停止・拒否が本当に副作用を止め、制約が要約を生き延びる統制)と
#   "L_trajectory_oversight"(軌跡監視軸: 検知の入力設計と人間の呼び出し方の
#   統制)。どちらも role: parallel で、L1〜L4 をゲートしません。BLOCK 判定の
#   ときだけ全体結論を BLOCK に引き下げます。
#
# 1 本の軸にまとめない理由:
#   採点は軸内の加重平均なので、1 軸に混ぜると独立であるべき統制が相殺されます。
#   監視入力の設計(O1)が満点でも、停止が副作用を止めない(E2 no)なら
#   その監視は enforce になりません — 「監視は立派だが床が無い」を別 verdict
#   として表面化させるために軸を分けています(account-resident overlay の
#   2 軸分割と同じ判断です)。
#
# 軌跡強制力軸だけ revise: 1.0(1 問でも no なら BLOCK)である理由:
#   出典調査の中心的な結論は 4 層の依存関係です — 強制力の床(層1)と軌跡の
#   保全(層2)が欠けると、上位の検知・人間(層3・層4)は機能しません。
#   barrier contract は測定された 6 フレームワークすべてで不成立、制約が要約から
#   落ちた場合の違反率は 38% に達します。床の欠落は「埋めてから委任する」段階的
#   改善項目(REVISE)と同列ではなく、上位統制が機能するための非交渉の前提なので、
#   加重平均で薄めず BLOCK として表面化させます。agent-authorization overlay が
#   boundary の threshold を全問必須へ強化したのと同じ理由づけです。軌跡監視軸
#   (検知・人間側)は段階的に改善可能な統制なので、通常の graded 判定のままです。
#
# id が "L_trajectory_*" である理由:
#   base の extension_points が add を許すのは `L*` / `efficacy` / `organization`
#   に合致する group だけです。`L*` セレクタは L で始まる任意の名前を受け、
#   gating か parallel かは name でなく `role` フィールドだけで決まります。
#   既存 overlay(high-stakes の `L5` / agent-authorization / account-resident の
#   `L_unattended_*`)とは名前が衝突しないため、同時適用できます。
#
# 設問設計の判定基準(自己申告で yes にならないこと):
#   「〜の方針があるか」型の設問は、方針文書を書いただけで yes になり統制として
#   機能しません。全 7 問を「棚卸し・試験・実測・記録が存在するか」の観測可能な
#   形にしています。特に E2 / E3 は「実際に試験・実走で確認したか」、E4 は
#   「構成の確認と検査の記録」(system message に置いたという申告だけでは no)、
#   O3 は「承認率の計測と再設計の運用」を問います。
#
# 適用の契約(重要):
#   この overlay を --overlay で指定すると、2 軸は常に採点されます。未回答は
#   unknown(0 点)として分母に残るため、未回答のまま適用すると BLOCK が出ます。
#   これは仕様です — 本 overlay は「数時間以上の自律実行・compaction を通る長さの
#   軌跡・並行実行、のいずれかを持ちうる委任を採点するときに、利用者が明示的に
#   適用する」追加質問セットです。該当機能が構成上存在しない場合は、E2〜E4 の
#   本文が定める構成証跡をもって yes と回答できます(証跡なしの「無いはず」は no)。
#
# 適用範囲の限定(重要):
#   この 2 軸は統制の存在を問う語彙であり、攻撃や逸脱を防ぐ機構ではありません。
#   admission point・監視器・constraint pinning の実装そのものは提供しません。
#   プロンプトインジェクションや監視器自体への攻撃は対象外で、別レイヤの対策が
#   必要です。また case_evidence の観測事実(observed_fact)には、出典調査が
#   一次確認できた arXiv 論文と Anthropic 公式ブログのみを使い、定量値を持たない
#   OpenAI の自己開示は使っていません(出典調査自身の一般化・較正閾値は
#   design_proposal としてラベル分けして持ちます)。
#
# account-resident overlay との住み分け(併用可):
#   U3(無人実行面軸)は「実行中タスクを止める手段が存在し、止まることを試験
#   したか」を問い、E2 は「拒否・停止中に**兄弟処理の副作用**まで止まるか」を
#   問います。kill switch の試験(U3 yes)は sibling leak の試験(E2)を代替
#   しません。同様に U2 は「逸脱を検知した実績」、O1 は「検知の**入力設計**」で、
#   検知できたことは入力設計の健全性を代替しません。
#
# 自分のフレームへの再利用: このファイルをコピーし、2 軸(強制力 4 問 / 監視
# 3 問)の構造を保ったまま質問を書き換え、case_evidence を自分の出典に差し替え
# ます。`aidr check-overlay <your-file>` で検証してください。
#
# マージ規則(`aidr check-overlay` が機械的に検証します):
#   add          : 項目の追加のみ(既存項目は read-only)
#   strengthen   : 数値閾値を厳しい方向に変えることのみ
# それ以外(削除・置換・緩和)は検証エラーになります。

version: 1
extends: four-layer-delegation-readiness

add:
  # --- L_trajectory_enforcement: the stop actually stops, the constraint survives
  # pass: 1.0, revise: 1.0 => any single "no" is BLOCK (non-compensating).
  # The axis is parallel, so it never gates L1-L4; but a BLOCK verdict does
  # drive the overall conclusion to BLOCK, the same as `organization`.
  - id: "L_trajectory_enforcement"
    name: trajectory_enforcement_axis
    name_ja: 軌跡強制力軸
    role: parallel
    pass: 1.0
    revise: 1.0
    purpose: |
      Whether the floor under any trajectory-level oversight actually holds:
      every side effect is admitted through mediated, non-bypassable paths,
      a denial or pause really stops sibling side effects, and the standing
      constraints survive context compaction on long runs. The source
      research shows the upper layers (detection, human escalation) do not
      enforce anything when this floor is missing, so this axis scores
      all-or-nothing instead of averaging the gaps away.
    case_evidence:
      - text: Stop Means Stop measured the approval gates, run cancellation, and timeouts of six widely used agent frameworks and found the barrier contract (no gated side effect executes during pause/cancel/timeout) holds on none of the six, with sibling leaks confirmed on the five that have pre-execution gates
        confidence: observed_fact
        source: https://arxiv.org/abs/2607.14166
      - text: SOUNDGATE, the repair that admits every side effect through one external gate — its admission-core model is formally verified, while the implementation carries model-checking and conformance evidence its authors call refinement evidence, not a mechanized proof — is a single 2026-07 preprint without third-party reproduction, and its authors state that complete mediation is an assumption, not a guarantee
        confidence: claim_needs_verification
        source: https://arxiv.org/abs/2607.14166
      - text: Governance Decay (7 models, 1,323 episodes) measured a 0% violation rate when a constraint survives summarization and 38% when it is dropped, and a roughly 47-token Constraint Pinning defense restores the rate to 0%
        confidence: observed_fact
        source: https://arxiv.org/abs/2606.22528
      - text: The decay measurements target in-context constraints and explicitly exclude immutable system messages, so whether a given platform keeps a system message out of compaction must be verified per platform rather than assumed
        confidence: gap_in_source
        source: https://arxiv.org/abs/2606.22528
  # E1 asks for mediation, not a path count or a single shared policy:
  # multiple routes and per-side-effect-class policies are acceptable (the
  # SOUNDGATE artifact itself mediates network egress through two
  # kernel-enforced routes). What fails the question is an unmediated route
  # that bypasses admission.
  - id: "L_trajectory_enforcement.E1"
    text: Have you inventoried every path a side effect (writes, network egress, external API calls) can take, and confirmed by test or configuration evidence that every path is enforced by an applicable admission policy, with no route that bypasses admission?
    text_ja: "副作用(書き込み・ネットワーク送信・外部 API 呼び出し)が通る経路を棚卸しし、すべての経路が該当する admission policy(通行審査)の強制下にあって、審査を迂回できる経路が無いことを試験または構成証跡で確認したか"
    weight: 1.0
  # E2 asks for an adversarial test, not trust in the framework's gate
  # semantics: the measured frameworks leak sibling side effects while an
  # approval is pending or denied. The alternative evidence must cover the
  # whole side-effect scope, not just in-run branches — a sequential
  # runtime can still leak through duplicate runs, retries, asynchronous
  # child jobs, or other workers touching the same side effects.
  - id: "L_trajectory_enforcement.E2"
    text: Have you confirmed, by an actual test that submits parallel tasks, that no side effect from a sibling branch executes while an approval is denied or the run is paused? Configuration evidence also counts only when it shows that no concurrent execution — parallel branches, duplicate or retried runs, asynchronous child jobs, or other workers — can touch the same side-effect scope.
    text_ja: "承認を拒否・停止した状態で、並行して走る別処理の副作用が実行されないことを、実際に並列タスクを投げる試験で確認したか(構成証跡で代える場合は、並列分岐だけでなく重複起動・retry・非同期の子ジョブ・別 worker を含め、同じ副作用範囲に並行実行が構成上存在しないことまで示すこと)"
    weight: 1.0
  # E3 asks for a live run past compaction, not a reading of the platform
  # docs: compaction optimizes for task continuity and drops standing
  # policies as low-salience. Two forms of confirmation count — inspecting
  # the post-compaction context, or a deterministic black-box test that
  # prohibited actions are still refused after compaction (the source
  # paper itself scores violations by whether a prohibited tool call is
  # emitted). The alternative evidence must rule out every context
  # transformation that can drop a constraint — summarization, history
  # truncation, session rollover, context rebuilding — not just the
  # summarizing kind of compaction; constraints enforced outside the
  # mutable context also qualify.
  - id: "L_trajectory_enforcement.E3"
    text: Have you run a long task until context compaction actually occurred, and confirmed the standing constraints still hold — by inspecting the post-compaction context, or by a deterministic test that prohibited actions are still refused after compaction? Configuration evidence also counts only when it shows that no context transformation that can drop a constraint (summarization, history truncation, session rollover, context rebuilding) can occur, or that the constraints are enforced outside the mutable context.
    text_ja: "長時間タスクを compaction(文脈要約)が走る長さまで実走させ、制約が保たれていることを確認したか(要約後の文脈の検査でも、要約後も禁止操作が拒否されることの決定論的試験でもよい。構成証跡で代える場合は、要約だけでなく履歴の切り捨て・セッション再構築など制約を落としうる文脈の変換が構成上発生しないこと、または制約が可変文脈の外側で強制されることまで示すこと)"
    weight: 1.0
  # E4 asks for configuration evidence plus an inspection record (the
  # inspection may be a direct context check or the deterministic
  # prohibited-action test from E3). Placing the constraint in a system
  # message alone stays no: whether a system message is compaction-exempt
  # is platform-dependent and outside the measured guarantee. The E3
  # alternative (no constraint-dropping context transformation can occur,
  # or the constraints are enforced outside the mutable context) counts
  # here as well.
  - id: "L_trajectory_enforcement.E4"
    text: Is there configuration evidence that the standing constraints are exempt from compaction (a pinned buffer or re-injection mechanism), and a record of inspecting their survival or re-injection after summarization? Placement in a system message alone does not count; the same alternative evidence as E3 (no constraint-dropping context transformation can occur, or the constraints are enforced outside the mutable context) also counts.
    text_ja: "禁止事項・制約が compaction の対象外(固定バッファまたは再注入の仕組み)であることを構成で確認し、要約後の生存または再注入を検査した記録があるか(system message に置いたという自己申告だけでは yes にしない。E3 と同じ代替証跡 — 制約を落としうる文脈の変換が構成上発生しない、または制約が可変文脈の外側で強制される — でもよい)"
    weight: 1.0

  # --- L_trajectory_oversight: the detection input design and the human side
  # pass: 1.0 (3/3), revise: 0.66 (2/3) => one gap is REVISE, two or more is
  # BLOCK. Oversight quality improves incrementally, so this axis stays
  # graded; the non-negotiable floor lives in the enforcement axis.
  - id: "L_trajectory_oversight"
    name: trajectory_oversight_axis
    name_ja: 軌跡監視軸
    role: parallel
    pass: 1.0
    revise: 0.66
    purpose: |
      Whether the detection and human sides of trajectory oversight are
      designed against the measured failure modes: the monitor judges what
      the agent did (user instructions plus tool calls) rather than what the
      agent said, the human is called on defined risk-based conditions
      instead of by default, and the accept rate of approval prompts is
      measured so a rubber-stamped confirmation step is visible as data.
    case_evidence:
      - text: TRACE measured a full-trajectory monitor (whole trajectory in one pass) as the weakest configuration at aggregate F1 0.577 versus 0.700 for a sequential monitor on SHADE-Arena tasks
        confidence: observed_fact
        source: https://arxiv.org/abs/2606.07054
      - text: In the evaluated hint-usage settings, models' chains of thought revealed their use of decisive hints less than 20% of the time, so monitoring that relies on what the model verbalizes can miss what actually drove the behavior
        confidence: observed_fact
        source: https://arxiv.org/abs/2505.05410
      - text: Anthropic's deployed Claude Code auto-mode classifier is reasoning-blind by design — it sees user messages and the agent's tool calls and strips the agent's own messages and tool outputs so the agent cannot talk the classifier into a bad call — and reports FPR 0.4% / FNR 17%; the same post reports that users accept 93% of manual permission prompts
        confidence: observed_fact
        source: https://www.anthropic.com/engineering/claude-code-auto-mode
      - text: The claim that these vendor-reported figures generalize beyond the coding-agent context they were measured in is the source analysis's generalization, and the accept-rate threshold at which a confirmation step should be redesigned is a design proposal each organization calibrates, not a measured boundary
        confidence: design_proposal
        source: https://suwa-sh.github.io/zenn-contents/articles/long-horizon-agent-trajectory-oversight_20260721/
      - text: Human escalation without dedicated tooling did not improve overall monitoring AUC; only escalating pre-flagged cases improved TPR (about +15 points at FPR=1%)
        confidence: observed_fact
        source: https://arxiv.org/abs/2508.19461
  # O1 mirrors the deployed reasoning-blind design: what must stay out of
  # the trust basis is agent-authored self-report (the agent's own messages
  # and reasoning), which the agent can use to talk the monitor into a bad
  # call. A tool-calls-only input is not required — the vendor reports that
  # variant lost the user-intent anchor and over-blocked. Independently
  # verified or pre-scanned observations (including tool outputs scanned in
  # a separate layer, as the vendor does) are acceptable inputs.
  - id: "L_trajectory_oversight.O1"
    text: Have you confirmed — by inspecting the monitor's input schema or an evaluation record — that monitoring or classification decisions are grounded in the user's instructions, the tool calls to be executed, and independently verified observations, and never take the agent's own messages or reasoning (what the agent says) as a basis for trust?
    text_ja: "監視・分類の判断根拠が、ユーザーの指示・実行される tool call・独立に検証された観測に基づいており、エージェント自身の発言・reasoning(自己申告)を信頼根拠にしていないことを、監視の入力スキーマの確認または評価記録で確かめたか"
    weight: 1.0
  # O2 does not penalize full human review: for high-stakes work it can be
  # the right mode. What it asks is that the mode is chosen per risk class
  # and the choice has an operational track record, instead of an
  # unexamined default.
  - id: "L_trajectory_oversight.O2"
    text: Is it defined, per risk class, when a human is called on detection (automatic continuation with a refusal reason, threshold-based escalation, or full human review), and is the operation of the chosen mode on record?
    text_ja: "検知時に人間をいつ呼ぶか(拒否理由を返して自動継続 / 閾値エスカレーション / 全件人間確認)がリスク分類に応じて定義され、その選択で運用した記録があるか"
    weight: 1.0
  # O3 asks for measurement plus an operating practice. The redesign
  # threshold (e.g. an accept rate staying above ~90%) is a design proposal
  # each organization calibrates against its own risk and volume — see
  # docs/15.
  - id: "L_trajectory_oversight.O3"
    text: Do you measure the accept rate of approval prompts over a defined period and volume, and is there a recorded practice of redesigning the confirmation step when the accept rate stays high?
    text_ja: "承認プロンプトの承認率を期間・母数つきで計測しており、承認率が高止まりしたときに確認ステップを再設計する運用の記録があるか"
    weight: 1.0
