# ドメイン overlay(応用例): 高責任専門業務(知財/法務/薬事)— 判定単位側
# (delegation-matrix を拡張)。
#
# オムロンの知財 AI エージェント内製の分析記事から抽出しています
# (https://suwa-sh.github.io/zenn-contents/articles/omron-ip-agent-insourcing_20260629/)。
#
# この overlay がやること:
#   1. 両軸の threshold を 2 → 3 に強化する: 軸が「high」と数えられるのは満点の
#      ときだけ。これは兄弟 overlay(four-layer 側)の case_evidence に記録した
#      反証(自己申告の短縮が実測と逆・pilot の約 95% が P&L 効果なし・専門ベンダー
#      製の法務ツールでも架空判例が残る)が正当化する慎重側の割り引きです。
#   2. 特許業務 4 工程の worked examples を強化後の閾値で採点して追加する。
#      分析記事の適性序列(分類 → 先行技術候補抽出 → 明細書ドラフト →
#      無効資料の確定)を示します。
#
# 注意 — この overlay の下で base 継承の examples を読むとき:
# overlay は既存項目を書き換えられないため、base の worked examples の region は
# base 閾値(2/3)時点の値のままです。強化後(3/3)で読むと 4 件がより厳しい
# region に落ちます:
#   entertainment_expense_determination  green  -> red
#   coding_mechanical_refactor           green  -> yellow
#   discriminatory_expression_detection  yellow -> red
#   expense_account_code_suggestion      yellow -> red
# これは慎重側割り引きの意図した効果で、tests/test_score_delegation.py が
# この読み替えを固定しています。
#
# マージ規則(`aidr check-overlay` が機械的に検証します):
#   add          : 項目の追加のみ(既存項目は read-only)
#   strengthen   : 数値閾値を厳しい方向に変えることのみ
# それ以外(削除・置換・緩和)は検証エラーになります。

version: 1
extends: delegation-matrix

strengthen:
  "verifiability": {threshold: 3}
  "answer_definability": {threshold: 3}

add:
  # Worked examples: patent-work process steps (the source analysis's layer-1
  # aptitude ordering). Regions are computed under the strengthened thresholds
  # (high requires 3/3 on an axis). All are design proposals: the observable
  # fact from the source case is only that Omron targeted prior-art search and
  # analysis-report generation first.
  - id: "examples.patent_classification"
    judgment: Patent classification (finite label set, large corpus of granted labels)
    case: Omron IP agent (design proposal from the analysis article)
    verifiability_yes: [V1, V2, V3]
    answer_definability_yes: [A1, A2, A3]
    region: green
    rationale: Multi-class classification against existing label codes; verdicts are mechanically checkable
    confidence: design_proposal
  - id: "examples.prior_art_candidate_retrieval"
    judgment: Prior-art search — candidate retrieval (not the "nothing found" verdict)
    case: Omron IP agent (design proposal from the analysis article)
    verifiability_yes: [V1, V2, V3]
    answer_definability_yes: [A1, A2]
    region: yellow
    rationale: Examiner citations give verifiable labels, but whether a candidate set is "sufficient" stays case-context dependent (A3 fails)
    confidence: design_proposal
  - id: "examples.patent_spec_draft"
    judgment: Patent specification draft (structure re-editing into problem/means/effect)
    case: Omron IP agent (design proposal from the analysis article)
    verifiability_yes: [V1, V2]
    answer_definability_yes: [A1, A2, A3]
    region: yellow
    rationale: Drafting rules are documentable, but claim-scope validity cannot be expressed as a re-runnable test (V3 fails)
    confidence: design_proposal
  - id: "examples.invalidity_search_final"
    judgment: Invalidity search — the "no relevant art exists" finalization
    case: Omron IP agent (design proposal from the analysis article)
    verifiability_yes: [V1, V2]
    answer_definability_yes: [A1, A2]
    region: red
    rationale: Exhaustiveness carries legal responsibility; a miss is neither cheaply verifiable afterwards nor uniquely definable in advance
    confidence: design_proposal
