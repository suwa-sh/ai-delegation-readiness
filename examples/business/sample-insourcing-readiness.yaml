# Sample input for `aidr check-readiness` with the insourcing-judgment overlay.
#
# Models a hypothetical company that has nailed BOTH the process prerequisites
# (L1-L4: documented, structured, scoped, controlled) AND the organizational
# scaffolding (organization axis: withdrawal authority, literacy layer,
# knowledge-transfer contract, incremental split, bus-factor countermeasure).
# What it has NOT settled is INSOURCING JUDGMENT RESPONSIBILITY: the final
# decision on the main architecture choices has no named in-house owner (it is
# still effectively made by the vendor). Everything else in the insourcing axis
# is in place.
#
# Expected result (with --overlay examples/overlays/insourcing-judgment/four-layer.yaml):
#   L1-L4 PASS, efficacy PASS, organization PASS, but L_insourcing REVISE (4/5,
#   I2 = no). Because L_insourcing is a parallel axis it does NOT gate L1-L4:
#   there is no "First gate to fix" line. This is the
#   "process delegable, organization ready, but insourcing judgment
#   responsibility not established" case. The answers are illustrative, not from
#   any real organization.

target: Mid-size firm insourcing an AI dev workflow (illustrative)

answers:
  # L1 Business standardization -> all yes
  L1.Q1: yes
  L1.Q2: yes
  L1.Q3: yes
  L1.Q4: yes

  # L2 Judgment structuring -> all yes
  L2.Q1: yes
  L2.Q2: yes
  L2.Q3: yes

  # L3 Delegation scope -> all yes
  L3.Q1: yes
  L3.Q2: yes
  L3.Q3: yes
  L3.Q4: yes

  # L4 Control & traceability -> all yes
  L4.Q1: yes
  L4.Q2: yes
  L4.Q3: yes
  L4.Q4: yes
  L4.Q5: yes

  # Efficacy measurement -> all yes
  efficacy.E1: yes
  efficacy.E2: yes
  efficacy.E3: yes
  efficacy.E4: yes

  # Organization readiness -> all yes (the org can absorb the delegation)
  organization.C1: yes
  organization.C2: yes
  organization.C3: yes
  organization.C4: yes
  organization.C5: yes
  organization.C6: yes

  # Insourcing judgment responsibility -> 4/5 (I2 is the real gap)
  L_insourcing.I0: yes   # core/non-core line is documented and owned in-house
  L_insourcing.I1: yes   # requirement priority is decided by a named PM
  L_insourcing.I2: no    # architecture final call still sits with the vendor (no in-house owner)
  L_insourcing.I3: yes   # acceptance criteria defined and signed off in-house
  L_insourcing.I4: yes   # exception/rollback responsibility is assigned
