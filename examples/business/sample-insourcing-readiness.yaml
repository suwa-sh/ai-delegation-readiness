# `aidr check-readiness` + 内製化 overlay のサンプル入力(応用例)。
#
#   bin/aidr check-readiness examples/business/sample-insourcing-readiness.yaml \
#     --overlay examples/overlays/insourcing-judgment/four-layer.yaml
#
# 業務プロセス(L1〜L4)も組織の受け皿(organization 軸)も整っているのに、
# 「内製化の判断責任」だけが未確立な架空企業の例です(回答は例示で、実在組織の
# 実データではありません)。ミドリ精機の物語とは独立した応用例です。
# 具体的には、主要なアーキテクチャの最終判断に社内の固有名がなく、
# 実質ベンダーが決めています(I2 = no)。それ以外の内製化軸は整っています。
#
# 期待される結果(overlay 適用時): L1〜L4・効果測定・組織は PASS、
# L_insourcing だけ REVISE(4/5)。L_insourcing は並列軸なので L1〜L4 を
# ゲートせず、「First gate to fix」は出ません。
# 「業務は委任できて組織も整っているが、判断責任の内製化が未確立」のケースです。

target: AI 開発ワークフローを内製化する中堅企業(例示)

answers:
  # L1 業務標準化層 → 全て yes
  L1.Q1: yes
  L1.Q2: yes
  L1.Q3: yes
  L1.Q4: yes

  # L2 判断構造化層 → 全て yes
  L2.Q1: yes
  L2.Q2: yes
  L2.Q3: yes

  # L3 委任範囲層 → 全て yes
  L3.Q1: yes
  L3.Q2: yes
  L3.Q3: yes
  L3.Q4: yes

  # L4 統制・追跡層 → 全て yes
  L4.Q1: yes
  L4.Q2: yes
  L4.Q3: yes
  L4.Q4: yes
  L4.Q5: yes

  # 効果測定 → 全て yes
  efficacy.E1: yes
  efficacy.E2: yes
  efficacy.E3: yes
  efficacy.E4: yes

  # 組織 readiness → 全て yes(組織は委任を受け止められる)
  organization.C1: yes
  organization.C2: yes
  organization.C3: yes
  organization.C4: yes
  organization.C5: yes
  organization.C6: yes

  # 内製化判断責任 → 4/5(I2 が本当の穴)
  L_insourcing.I0: yes   # コア/ノンコアの線引きは文書化され社内決裁済み
  L_insourcing.I1: yes   # 要件の優先順位は社内の PM が決裁している
  L_insourcing.I2: no    # アーキテクチャの最終判断は実質ベンダー(社内の固有名がない)
  L_insourcing.I3: yes   # 受入基準は社内で定義・検収している
  L_insourcing.I4: yes   # 例外・差し戻しの責任者は決まっている
