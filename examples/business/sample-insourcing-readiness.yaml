# `aidr check-readiness` + 内製化 overlay のサンプル入力(応用例)。
# `aidr init --target four-layer --overlay ../overlays/insourcing-judgment/four-layer.yaml`
# のテンプレートに回答を書き込んだものです。
#
#   bin/aidr check-readiness examples/business/sample-insourcing-readiness.yaml \
#     --overlay examples/overlays/insourcing-judgment/four-layer.yaml
#
# 業務プロセス(L1〜L4)も組織の受け皿(organization 軸)も整っているのに、
# 「内製化の判断責任」だけが未確立な架空企業の例です(ミドリ精機の物語とは独立)。
# 期待される結果(overlay 適用時): L_insourcing だけ REVISE(4/5、I2 = no)。
# 並列軸なので L1〜L4 をゲートせず、「First gate to fix」は出ません。

target: AI 開発ワークフローを内製化する中堅企業(例示)

answers:
  # --- L1〜L4・効果測定・組織 → 全て yes ---
  L1.Q1: yes                       # 問: 判断基準は文書化され、暗黙知に依存していないか
  L1.Q2: yes                       # 問: 例外ケースは(暗黙でなく)例外手続きとして明文化されているか
  L1.Q3: yes                       # 問: 規定集は版管理されているか(改定日・理由・履歴を辿れるか)
  L1.Q4: yes                       # 問: SOP は第三者が読んで再現できる粒度で書かれているか
  L2.Q1: yes                       # 問: 規定の各条項を「どの入力を・どの条件で・どう判定するか」の三つ組に落とせるか
  L2.Q2: yes                       # 問: 決定論的処理・LLM の推論・人間へのエスカレーションの線引きが明確か
  L2.Q3: yes                       # 問: 判定ロジックの変更時に精度劣化を検出する回帰テストがあるか
  L3.Q1: yes                       # 問: 第三者が同一入力で同じ判定を採点できるか
  L3.Q2: yes                       # 問: 判定根拠を規定の条番号(または SOP のステップ番号)に紐付けられるか
  L3.Q3: yes                       # 問: 正解を定義しにくい領域(倫理判断・新規ポリシー策定)を委任対象から除外できているか
  L3.Q4: yes                       # 問: 後から監査ログで判定を再現できるか
  L4.Q1: yes                       # 問: 職務分掌を保つため「判定」と「実行」が分離されているか
  L4.Q2: yes                       # 問: 判定根拠(参照規定 + チェック項目)をログから取り出せるか
  L4.Q3: yes                       # 問: 監査ログは Who/When/What/Why/Result を構造化スキーマで記録しているか
  L4.Q4: yes                       # 問: 規定改定後も過去判定を再検証できるよう、規定バージョンをログに固定しているか
  L4.Q5: yes                       # 問: 誤承認の補正フローが設計され、ログに残るか
  efficacy.E1: yes                 # 問: 削減数値の分母・基準値・期間を説明できるか
  efficacy.E2: yes                 # 問: 期待値(ベンダー試算)と実績(自社実測)を区別しているか
  efficacy.E3: yes                 # 問: 数値の対象範囲(業務全体か一部か)を明示しているか
  efficacy.E4: yes                 # 問: AI 起因の誤承認・誤差し戻しを効率とは別に集計しているか
  organization.C1: yes             # 問: 8〜12 ヶ月以内に「やめる」と決められる権限と文化があるか
  organization.C2: yes             # 問: 受け皿となる全社リテラシー層(ビジネス側人材)が 2 桁人数まで育っているか
  organization.C3: yes             # 問: AI ツール基盤(Copilot・社内チャット・RAG)が個人レベルで定着しているか
  organization.C4: yes             # 問: 知識移転契約で内面化(SECI の I)を KPI にできるか(例: IPA モデル契約)
  organization.C5: yes             # 問: 拡大期の漸進分割(Stream-aligned から Complicated-Subsystem / Platform への切り出し)を事前に設計できるか
  organization.C6: yes             # 問: bus factor 対策(ペアプロ・ADR・Knowledge Transfer Day)を運用しているか

  # --- 内製化判断責任(overlay の並列軸)→ 4/5(I2 が本当の穴) ---
  L_insourcing.I0: yes             # 問: コア/ノンコアの線引き(何を内製範囲と呼ぶか)が文書化され、社内の固有名で決裁されているか
  L_insourcing.I1: yes             # 問: 要件の優先順位(何を作り、何を作らないか)を社内の固有名が決裁しているか → 社内の PM が決裁している
  L_insourcing.I2: no              # 問: 主要な技術選定(アーキテクチャ)の最終判断を社内の固有名が持っているか → 実質ベンダーが決めている(社内の固有名がない)
  L_insourcing.I3: yes             # 問: 受入基準(合否ライン)を社内の固有名が定義し、成果物を検収しているか
  L_insourcing.I4: yes             # 問: 例外・差し戻しのとき、どこで人が介入し誰が責任を負うかが定義されているか
