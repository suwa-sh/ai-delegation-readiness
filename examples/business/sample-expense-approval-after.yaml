# `aidr check-readiness` のサンプル入力(物語ステップ 2': 改善後の再診断)。
# `aidr init --target four-layer --overlay ../overlays/sample-company/extra-rules.yaml`
# のテンプレートに回答を書き込んだものです(問いのコメントは定義の text_ja と同一)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)の経理部が、初回診断
# (sample-expense-approval.yaml → BLOCK)で見つかった穴を半年かけて塞いだ後の
# 再診断です。結果は PASS(exit 0)になり、ここで初めて次のステップ
# (score-delegation での判定単位の振り分け)へ進めます。
# 末尾 2 問はミドリ精機の自社 overlay の追加質問で、overlay なしの実行では無視されます。

target: 経費精算承認(ミドリ精機・経理部、FY2026 下期 改善後の再診断)

answers:
  # --- L1 業務標準化層(SOP 詳細化済み) ---
  L1.Q1: yes                       # 問: 判断基準は文書化され、暗黙知に依存していないか
  L1.Q2: yes                       # 問: 例外ケースは(暗黙でなく)例外手続きとして明文化されているか
  L1.Q3: yes                       # 問: 規定集は版管理されているか(改定日・理由・履歴を辿れるか)
  L1.Q4: yes                       # 問: SOP は第三者が読んで再現できる粒度で書かれているか → SOP を第三者が再現できる粒度に詳細化

  # --- L2 判断構造化層(線引き設計 + 回帰テスト導入済み) ---
  L2.Q1: yes                       # 問: 規定の各条項を「どの入力を・どの条件で・どう判定するか」の三つ組に落とせるか
  L2.Q2: yes                       # 問: 決定論的処理・LLM の推論・人間へのエスカレーションの線引きが明確か → 決定論的処理 / LLM / 人間の線引きを設計
  L2.Q3: yes                       # 問: 判定ロジックの変更時に精度劣化を検出する回帰テストがあるか → 回帰テストを CI に組込み

  # --- L3 委任範囲層 ---
  L3.Q1: yes                       # 問: 第三者が同一入力で同じ判定を採点できるか
  L3.Q2: yes                       # 問: 判定根拠を規定の条番号(または SOP のステップ番号)に紐付けられるか
  L3.Q3: yes                       # 問: 正解を定義しにくい領域(倫理判断・新規ポリシー策定)を委任対象から除外できているか
  L3.Q4: yes                       # 問: 後から監査ログで判定を再現できるか → 監査ログからの再現が可能に

  # --- L4 統制・追跡層(監査ログ・補正フロー実装済み) ---
  L4.Q1: yes                       # 問: 職務分掌を保つため「判定」と「実行」が分離されているか
  L4.Q2: yes                       # 問: 判定根拠(参照規定 + チェック項目)をログから取り出せるか
  L4.Q3: yes                       # 問: 監査ログは Who/When/What/Why/Result を構造化スキーマで記録しているか
  L4.Q4: yes                       # 問: 規定改定後も過去判定を再検証できるよう、規定バージョンをログに固定しているか
  L4.Q5: yes                       # 問: 誤承認の補正フローが設計され、ログに残るか

  # --- 効果測定 ---
  efficacy.E1: yes                 # 問: 削減数値の分母・基準値・期間を説明できるか
  efficacy.E2: yes                 # 問: 期待値(ベンダー試算)と実績(自社実測)を区別しているか
  efficacy.E3: yes                 # 問: 数値の対象範囲(業務全体か一部か)を明示しているか → 対象範囲を「経費精算の一次チェックのみ」と明示
  efficacy.E4: yes                 # 問: AI 起因の誤承認・誤差し戻しを効率とは別に集計しているか

  # --- 組織 readiness(受け皿の整備完了) ---
  organization.C1: yes             # 問: 8〜12 ヶ月以内に「やめる」と決められる権限と文化があるか → 12 ヶ月で成果が出なければやめる、と経営会議で決裁済み
  organization.C2: yes             # 問: 受け皿となる全社リテラシー層(ビジネス側人材)が 2 桁人数まで育っているか → 経理・購買に受け皿人材を 12 名育成
  organization.C3: yes             # 問: AI ツール基盤(Copilot・社内チャット・RAG)が個人レベルで定着しているか
  organization.C4: yes             # 問: 知識移転契約で内面化(SECI の I)を KPI にできるか(例: IPA モデル契約)
  organization.C5: yes             # 問: 拡大期の漸進分割(Stream-aligned から Complicated-Subsystem / Platform への切り出し)を事前に設計できるか
  organization.C6: yes             # 問: bus factor 対策(ペアプロ・ADR・Knowledge Transfer Day)を運用しているか → ペア作業と ADR を運用中

  # --- ミドリ精機の自社ルール(overlay 適用時のみ採点) ---
  L1.MIDORI_Q5: yes                # 問: 規程集は直近 12 ヶ月以内に法務のレビューを受けているか
  L4.MIDORI_Q6: yes                # 問: 監査ログは改ざん検知可能なストア(WORM・ハッシュチェーン・署名)に保存されているか → ハッシュチェーン付きストアに保存
