# `aidr check-readiness` のサンプル入力(物語ステップ 2': 改善後の再診断)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)の経理部が、初回診断
# (sample-expense-approval.yaml → BLOCK)で見つかった穴を半年かけて塞いだ後の
# 再診断です。結果は PASS(exit 0)になり、ここで初めて次のステップ
# (score-delegation での判定単位の振り分け)へ進めます。
#
# 初回からの主な改善:
#   L1.Q4  SOP を第三者が再現できる粒度まで詳細化した
#   L2.Q2  決定論的処理 / LLM 推論 / 人間エスカレーションの線引きを設計した
#   L2.Q3  判定ロジックの回帰テストを CI に組み込んだ
#   L3.Q4 / L4.Q1-Q5  監査ログ(Who/When/What/Why/Result + 規定バージョン固定)と
#          誤承認の補正フローを実装し、判定と実行を分離した
#   efficacy.E3  効果測定の対象範囲を「経費精算の一次チェックのみ」と明示した
#   organization  撤退権限・リテラシー層・知識移転契約・bus factor 対策を整備した

target: 経費精算承認(ミドリ精機・経理部、FY2026 下期 改善後の再診断)

answers:
  # L1 業務標準化層(SOP 詳細化済み)
  L1.Q1: yes
  L1.Q2: yes
  L1.Q3: yes
  L1.Q4: yes

  # L2 判断構造化層(線引き設計 + 回帰テスト導入済み)
  L2.Q1: yes
  L2.Q2: yes
  L2.Q3: yes

  # L3 委任範囲層(監査ログからの再現が可能に)
  L3.Q1: yes
  L3.Q2: yes
  L3.Q3: yes
  L3.Q4: yes

  # L4 統制・追跡層(監査ログ・補正フロー実装済み)
  L4.Q1: yes
  L4.Q2: yes
  L4.Q3: yes
  L4.Q4: yes
  L4.Q5: yes

  # 効果測定(対象範囲を明示)
  efficacy.E1: yes
  efficacy.E2: yes
  efficacy.E3: yes
  efficacy.E4: yes

  # 組織 readiness(受け皿の整備完了)
  organization.C1: yes    # 12 ヶ月で成果が出なければやめる、と経営会議で決裁済み
  organization.C2: yes    # 経理・購買に AI 活用の受け皿人材を 12 名育成
  organization.C3: yes    # 社内チャット AI の利用が個人レベルで定着
  organization.C4: yes    # ベンダー契約に知識移転(内面化)を KPI として明記
  organization.C5: yes    # 拡大期のチーム分割案を事前設計済み
  organization.C6: yes    # ペア作業と ADR で属人化対策を運用中
