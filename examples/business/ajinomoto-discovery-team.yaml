# Sample input for `aidr check-readiness`.
#
# Models a hypothetical small full-stack "exploration phase" team that wants
# to delegate a high-risk routine judgment to an AI agent. It has nailed the
# PROCESS prerequisites (documented rules, structured judgments, controls,
# defensible efficacy numbers) but has NOT built the ORGANIZATIONAL scaffolding
# (a company-wide literacy layer, a knowledge-transfer contract, an
# incremental-split design, a bus-factor countermeasure).
#
# Expected result: L1-L4 and efficacy PASS, but the organization axis BLOCKs.
# This is the "process delegable, but the organization can't absorb it" case.
# The answers are illustrative, not from any real organization.

target: New-business discovery team (small full-stack, exploration phase)

answers:
  # L1 Business standardization -> all yes (documented, versioned, reproducible)
  L1.Q1: yes
  L1.Q2: yes
  L1.Q3: yes
  L1.Q4: yes

  # L2 Judgment structuring -> all yes (mapped, layered, regression-tested)
  L2.Q1: yes
  L2.Q2: yes
  L2.Q3: yes

  # L3 Delegation scope -> all yes (verifiable, clause-linked, reproducible)
  L3.Q1: yes
  L3.Q2: yes
  L3.Q3: yes
  L3.Q4: yes

  # L4 Control & traceability -> all yes (SoD, structured log, pinned version, correction flow)
  L4.Q1: yes
  L4.Q2: yes
  L4.Q3: yes
  L4.Q4: yes
  L4.Q5: yes

  # Efficacy measurement -> all yes (denominator, baseline, scope, error tracking)
  efficacy.E1: yes
  efficacy.E2: yes
  efficacy.E3: yes
  efficacy.E4: yes

  # Organization readiness -> mostly no (the real gap for this team)
  organization.C1: yes   # withdrawal authority exists (small team can pull the plug fast)
  organization.C2: no    # no company-wide literacy layer to receive the tool
  organization.C3: yes   # individual-level AI tooling is established
  organization.C4: no    # no knowledge-transfer contract (internalization not a KPI)
  organization.C5: no    # no incremental-split design for the scaling phase
  organization.C6: no    # no bus-factor countermeasure (pairing / ADR / KT Day)
