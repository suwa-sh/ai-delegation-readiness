# `aidr check-readiness` のサンプル入力(物語ステップ 2: 初回診断)。
# `aidr init --target four-layer` のテンプレートに回答を書き込んだものです
# (問いのコメントは定義の text_ja と同一。→ 以降が回答の背景です)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)の経理部が、スクリーニングで
# 「高自動化」と出た経費精算承認業務を初めて診断する場面です。
# 結果は BLOCK(委任不可)になります: 規定はあるが SOP の粒度が粗く(L1)、
# 判定ロジックの構造化が途中で(L2)、統制・追跡層(L4)は未着手だからです。
# 改善後の再診断は sample-expense-approval-after.yaml を見てください。
#
# 回答は yes/no(true/false, 1/0 も可)。未回答は unknown(採点上 no)になります。

target: 経費精算承認(ミドリ精機・経理部、FY2026 初回診断)

answers:
  # --- L1 業務標準化層 ---
  L1.Q1: yes                       # 問: 判断基準は文書化され、暗黙知に依存していないか → 経費規程として文書化済み
  L1.Q2: yes                       # 問: 例外ケースは(暗黙でなく)例外手続きとして明文化されているか → 海外出張・慶弔は例外手続きあり
  L1.Q3: yes                       # 問: 規定集は版管理されているか(改定日・理由・履歴を辿れるか)
  L1.Q4: no                        # 問: SOP は第三者が読んで再現できる粒度で書かれているか → 粒度が粗く第三者が再現できない

  # --- L2 判断構造化層 ---
  L2.Q1: yes                       # 問: 規定の各条項を「どの入力を・どの条件で・どう判定するか」の三つ組に落とせるか
  L2.Q2: no                        # 問: 決定論的処理・LLM の推論・人間へのエスカレーションの線引きが明確か → 線引きが未設計
  L2.Q3: no                        # 問: 判定ロジックの変更時に精度劣化を検出する回帰テストがあるか → 回帰テストがない

  # --- L3 委任範囲層 ---
  L3.Q1: yes                       # 問: 第三者が同一入力で同じ判定を採点できるか
  L3.Q2: yes                       # 問: 判定根拠を規定の条番号(または SOP のステップ番号)に紐付けられるか
  L3.Q3: yes                       # 問: 正解を定義しにくい領域(倫理判断・新規ポリシー策定)を委任対象から除外できているか
  L3.Q4: no                        # 問: 後から監査ログで判定を再現できるか → ログからの再現がまだできない

  # --- L4 統制・追跡層(未着手) ---
  L4.Q1: no                        # 問: 職務分掌を保つため「判定」と「実行」が分離されているか
  L4.Q2: no                        # 問: 判定根拠(参照規定 + チェック項目)をログから取り出せるか
  L4.Q3: no                        # 問: 監査ログは Who/When/What/Why/Result を構造化スキーマで記録しているか
  L4.Q4: no                        # 問: 規定改定後も過去判定を再検証できるよう、規定バージョンをログに固定しているか
  L4.Q5: no                        # 問: 誤承認の補正フローが設計され、ログに残るか

  # --- 効果測定 ---
  efficacy.E1: yes                 # 問: 削減数値の分母・基準値・期間を説明できるか
  efficacy.E2: yes                 # 問: 期待値(ベンダー試算)と実績(自社実測)を区別しているか
  efficacy.E3: no                  # 問: 数値の対象範囲(業務全体か一部か)を明示しているか → 対象範囲を明示していない
  efficacy.E4: yes                 # 問: AI 起因の誤承認・誤差し戻しを効率とは別に集計しているか
