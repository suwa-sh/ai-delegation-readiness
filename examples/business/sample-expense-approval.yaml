# `aidr check-readiness` のサンプル入力(物語ステップ 2: 初回診断)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)の経理部が、スクリーニングで
# 「高自動化」と出た経費精算承認業務を初めて診断する場面です。
# 結果は BLOCK(委任不可)になります: 規定はあるが SOP の粒度が粗く(L1)、
# 判定ロジックの構造化が途中で(L2)、統制・追跡層(L4)は未着手だからです。
# 改善後の再診断は sample-expense-approval-after.yaml を見てください。
#
# 回答は yes/no(true/false, 1/0 も可)です。未回答の質問は unknown として
# 報告され、採点上は no 扱いになります。
# 回答キーは definitions/four-layer.yaml の item id(group.leaf、例 "L1.Q1")です。
# 質問の日本語文は同ファイルの text_ja を参照してください。

target: 経費精算承認(ミドリ精機・経理部、FY2026 初回診断)

answers:
  # L1 業務標準化層
  L1.Q1: yes    # 判断基準は経費規程として文書化済み
  L1.Q2: yes    # 例外(海外出張・慶弔)は例外手続きとして明文化済み
  L1.Q3: yes    # 経費規程は版管理されている
  L1.Q4: no     # SOP の粒度が粗く、第三者が読んで再現できない

  # L2 判断構造化層
  L2.Q1: yes    # 規程の各条項は「入力・条件・判定」に落とせる
  L2.Q2: no     # 決定論的処理 / LLM 推論 / 人間エスカレーションの線引きが未設計
  L2.Q3: no     # 判定ロジック変更時の回帰テストがない

  # L3 委任範囲層
  L3.Q1: yes
  L3.Q2: yes
  L3.Q3: yes
  L3.Q4: no     # 監査ログからの判定再現がまだできない

  # L4 統制・追跡層(未着手)
  L4.Q1: no     # 「判定」と「実行」が分離されていない
  L4.Q2: no     # 判定根拠をログから取り出せない
  L4.Q3: no     # 監査ログに Who/When/What/Why/Result の構造がない
  L4.Q4: no     # 規定バージョンをログに固定していない
  L4.Q5: no     # 誤承認の補正フローが未設計

  # 効果測定(efficacy)
  efficacy.E1: yes      # 削減見込みの分母・基準値は文書化済み
  efficacy.E2: yes      # 期待値(ベンダー試算)と実績は区別している
  efficacy.E3: no       # 対象範囲(全業務か一部か)を明示していない
  efficacy.E4: yes      # 誤承認は効率と別に集計する設計
