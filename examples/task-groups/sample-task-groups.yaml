# `aidr screen-transition` のサンプル入力(物語ステップ 1)。
# `aidr init --target transition` のテンプレートに回答を書き込んだものです
# (問いのコメントは定義の text_ja と同一。→ 以降が回答の背景です)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)が「経理業務に AI を活用せよ」
# という経営指示を受け、どのタスク群から手を付けるかを 4 類型に振り分ける場面です。
# 経理部を中心に、比較のため営業事務・設備保全のタスク群も並べています。
#
# 全質問への回答が必須です(fail-closed): 未回答は「no 扱い」にならず、
# 欠落 id を列挙した入力エラー(exit 3)になります。

task_groups:
  # 文書作成は AI に晒されるが、財務報告は規制上人間の最終判断が必須(H1)で、開示の量は増やせない(需要非弾力)。=> 再編(priority 1)+ [HITL]。
  - id: financial_disclosure_draft
    description: 決算開示資料のドラフト作成(経理部・四半期ごと)
    answers:
      technical_exposure.E1: yes   # 問: タスク時間の過半が(物理作業や対面でなく)情報処理(文書・データ・コード)か → 作業時間の大半は文書・数値の編集
      technical_exposure.E2: no    # 問: 主要タスクの入出力がデジタルデータだけで完結するか(物理的な取り扱いが不要か) → 監査法人との照会など紙・対面が残る
      technical_exposure.E3: yes   # 問: 現行の AI ツールで品質を保ったまま、中核タスクの所要時間を半減できるか(Eloundou らの exposure 基準)
      human_necessity.H1: yes      # 問: 権利・財務・健康・規制のいずれかに影響し、法令・規制・監査上、人間の判断や署名が要求されるか(HITL 既定固定域) → J-SOX・開示規制上、人間の承認が必須
      human_necessity.H2: yes      # 問: 対人関係そのもの(信頼・交渉・ケア)が、この仕事が提供する価値の中核か → 監査法人・IR との信頼関係が中核
      human_necessity.H3: no       # 問: 現場での物理作業や身体的スキルが不可欠か
      demand_elasticity.D1: no     # 問: コストや納期が大きく下がれば、顧客や社内からの依頼件数が増える見込みがあるか → 安くなっても開示資料の本数は増えない
      demand_elasticity.D2: no     # 問: 価格や速度がボトルネックで、満たされていない潜在需要が今あるか
      demand_elasticity.D3: yes    # 問: 需要の伸びを止める上限(規制枠・固定予算など)が無いか → 制度上の上限はない

  # デジタル完結・規則ベースで、件数は業務量で決まる(非弾力)。=> 高自動化(priority 2)。次のステップ(check-readiness)へ進む候補。
  - id: expense_entry_check
    description: 経費精算の申請チェック(領収書・インボイス・勘定科目)
    answers:
      technical_exposure.E1: yes   # 問: タスク時間の過半が(物理作業や対面でなく)情報処理(文書・データ・コード)か
      technical_exposure.E2: yes   # 問: 主要タスクの入出力がデジタルデータだけで完結するか(物理的な取り扱いが不要か)
      technical_exposure.E3: yes   # 問: 現行の AI ツールで品質を保ったまま、中核タスクの所要時間を半減できるか(Eloundou らの exposure 基準)
      human_necessity.H1: no       # 問: 権利・財務・健康・規制のいずれかに影響し、法令・規制・監査上、人間の判断や署名が要求されるか(HITL 既定固定域) → 個々のチェックは規定で機械判定できる(最終統制は L4 で設計)
      human_necessity.H2: no       # 問: 対人関係そのもの(信頼・交渉・ケア)が、この仕事が提供する価値の中核か
      human_necessity.H3: no       # 問: 現場での物理作業や身体的スキルが不可欠か
      demand_elasticity.D1: no     # 問: コストや納期が大きく下がれば、顧客や社内からの依頼件数が増える見込みがあるか → 安くなっても申請件数は増えない
      demand_elasticity.D2: no     # 問: 価格や速度がボトルネックで、満たされていない潜在需要が今あるか
      demand_elasticity.D3: no     # 問: 需要の伸びを止める上限(規制枠・固定予算など)が無いか

  # 安く速く出せるほど商談数が増える(需要弾力的)。=> 成長(priority 3)。
  - id: sales_proposal_draft
    description: 見積・提案書のドラフト作成(営業事務)
    answers:
      technical_exposure.E1: yes   # 問: タスク時間の過半が(物理作業や対面でなく)情報処理(文書・データ・コード)か
      technical_exposure.E2: yes   # 問: 主要タスクの入出力がデジタルデータだけで完結するか(物理的な取り扱いが不要か)
      technical_exposure.E3: yes   # 問: 現行の AI ツールで品質を保ったまま、中核タスクの所要時間を半減できるか(Eloundou らの exposure 基準)
      human_necessity.H1: no       # 問: 権利・財務・健康・規制のいずれかに影響し、法令・規制・監査上、人間の判断や署名が要求されるか(HITL 既定固定域)
      human_necessity.H2: yes      # 問: 対人関係そのもの(信頼・交渉・ケア)が、この仕事が提供する価値の中核か → 顧客との関係構築が価値の中核
      human_necessity.H3: no       # 問: 現場での物理作業や身体的スキルが不可欠か
      demand_elasticity.D1: yes    # 問: コストや納期が大きく下がれば、顧客や社内からの依頼件数が増える見込みがあるか → 見積が速いほど引き合いが増える
      demand_elasticity.D2: yes    # 問: 価格や速度がボトルネックで、満たされていない潜在需要が今あるか → 提案が間に合わず失注がある
      demand_elasticity.D3: yes    # 問: 需要の伸びを止める上限(規制枠・固定予算など)が無いか

  # 現場の物理作業が中心で exposure が低い。=> 変化小(priority 4)。監視のみ。
  - id: equipment_maintenance
    description: 工場設備の点検・修理(設備保全課)
    answers:
      technical_exposure.E1: no    # 問: タスク時間の過半が(物理作業や対面でなく)情報処理(文書・データ・コード)か
      technical_exposure.E2: no    # 問: 主要タスクの入出力がデジタルデータだけで完結するか(物理的な取り扱いが不要か)
      technical_exposure.E3: yes   # 問: 現行の AI ツールで品質を保ったまま、中核タスクの所要時間を半減できるか(Eloundou らの exposure 基準) → 点検報告書の作成だけは短縮できる
      human_necessity.H1: no       # 問: 権利・財務・健康・規制のいずれかに影響し、法令・規制・監査上、人間の判断や署名が要求されるか(HITL 既定固定域)
      human_necessity.H2: no       # 問: 対人関係そのもの(信頼・交渉・ケア)が、この仕事が提供する価値の中核か
      human_necessity.H3: yes      # 問: 現場での物理作業や身体的スキルが不可欠か → 現場での物理作業が不可欠
      demand_elasticity.D1: yes    # 問: コストや納期が大きく下がれば、顧客や社内からの依頼件数が増える見込みがあるか → 安ければ予防保全の頻度は増やしたい
      demand_elasticity.D2: no     # 問: 価格や速度がボトルネックで、満たされていない潜在需要が今あるか
      demand_elasticity.D3: no     # 問: 需要の伸びを止める上限(規制枠・固定予算など)が無いか
