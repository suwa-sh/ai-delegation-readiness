# `aidr check-task-contract` のサンプル入力(物語ステップ 4: 契約充足の例)。
# `aidr init --target task-contract` のテンプレートに回答を書き込んだものです
# (問いのコメントは定義の text_ja と同一)。
#
# ミドリ精機株式会社(架空。examples/README.md 参照)が、委任 OK と判定した
# 「領収書必須項目チェック」を経費チェックエージェントに渡す前の実行契約です。
# 4 要素(意図・境界・証跡・採点者)がすべて宣言済みで、AI 採点者には
# iRULER 二重評価があるため GREEN(exit 0)になります。

task: 経費チェックエージェントへの経費精算チェック委任(ミドリ精機・経理部)

answers:
  # --- 意図(intent): 何を満たせば合格か ---
  intent.I1: yes                   # 問: 合格条件(何を満たせば成果物を受け入れるか)が明文化されているか → 必須項目の充足 + 金額閾値
  intent.I2: yes                   # 問: 受け入れ基準を機械的に確認できるか(再実行可能なテスト、または列挙可能なリスト)
  intent.I3: yes                   # 問: 主成果物が名指しされ、「完了」の定義が曖昧でないか → approved / rejected / escalated の判定

  # --- 境界(boundary): やってはいけないこと・いつ止めるか ---
  boundary.B1: yes                 # 問: 禁止事項(エージェントがやってはいけないこと)が列挙されているか → エスカレーション金額超の自動承認は禁止
  boundary.B2: yes                 # 問: エスカレーション条件(いつ止めて人間に渡すか)が定義されているか → 領収書欠落・閾値超過は人間へ
  boundary.B3: yes                 # 問: データアクセス範囲が最小権限で限定されているか(どのソースを読んでよいか) → 経費 DB の該当行と経費規程のみ読み取り可

  # --- 証跡(evidence): どの入出力を残すか ---
  evidence.E1: yes                 # 問: 記録する入出力の範囲(監査スコープ)が定義されているか → 入力行・参照規定・判定を記録
  evidence.E2: yes                 # 問: 判定ごとに Who/When/What/Why/Result を記録しているか
  evidence.E3: yes                 # 問: 記録は決定的なステップで生成されるか(長時間実行で省略されうる後付け処理でないか) → 決定的な採点ステップが生成(後付けでない)

  # --- 採点者(scorer): 誰が採点するか ---
  scorer.S1: yes                   # 問: 採点者が割り付けられているか(特定の人間・AI 採点者・二段審査のいずれか)
  scorer.S2: yes                   # 問: 採点ルーブリック自体が明文化されているか(暗黙のままにしていないか)
  scorer.type: ai_judge            # human | ai_judge | two_stage(必須)
  scorer.iruler_double_eval: yes   # AI 採点者(ai_judge)のとき、二重評価があるか(yes/no) → ルーブリック自体を別ルーブリックで評価する二重評価あり
